 return inc?(D.map(w=>SRC[w]).find(Boolean)||'Other'):(D.map(w=>Object.keys(CW).find(k=>CW[k].split(' ').includes(w))).find(Boolean)||'Others')}
function learn(desc,cat,type){if(type!='expense'&&type!='income')return;const D=norm(desc);if(!D.length||!cat)return;
 const keys=[D.join(' ')];if(D.length<=2)keys.push(...D.filter(w=>w.length>2));
 keys.forEach(k=>{if(cat=='Others'||cat=='Other')delete S.cr[k];else S.cr[k]=cat});
 const ks=Object.keys(S.cr);if(ks.length>300)ks.slice(0,ks.length-300).forEach(k=>delete S.cr[k])}

  if(d<=lim&&!(r.skip||[]).includes(ym)&&!S.tx.some(t=>t.ri==r.id&&t.rm==ym))o.push({r,ym,date:d,amt:r.amt,title:r.title})}));return o}
function riForm(i){const r=i?S.ri.find(x=>x.id==i):{};

  if(i)Object.assign(r,q);else{const n=id();S.ri.push({id:n,skip:+td().slice(8)>d?[ym0(0)]:[],...q})}save()})}

 d.innerHTML=`<h3>${E(r.title)}</h3><small>UGX ${F(r.amt)} on day ${r.day} of each month · ${r.on===false?'paused':'active'}</small><div class=row style="justify-content:flex-start;flex-wrap:wrap"><button class=p onclick="dlg.close();riForm(${i})">Edit</button><button onclick="dlg.close();riSkip(${i})">Skip this month</button><button onclick="dlg.close();UD('Recurring income deleted',()=>{S.ri=S.ri.filter(x=>x.id!=${i})})">Delete</button><button onclick=dlg.close()>Close</button></div>`;d.showModal()}

  const a=pa(f.amt);if(!a)return'Enter a valid amount';addTx('income',a,f.acc,r.src,r.title,f.date,{ri:r.id,rm:ym});save()})}

/* ---------- Plan Month ---------- */
let pmo=0;
function cmMonth(ym,cur){const[Y,M]=ym.split('-').map(Number),f=ym+'-01',l=ym+'-'+String(dim(Y,M-1)).padStart(2,'0'),o=[];
 S.cm.forEach(c=>{if(!c.due)return;
  if(c.st=='paid'){if(c.due>=f&&c.due<=l)o.push({c,due:c.due,amt:c.amt,left:0,paid:1});return}
  if(c.due>=f&&c.due<=l)o.push({c,due:c.due,amt:c.amt,left:rem(c)});
  else if(cur&&c.due<f)o.push({c,due:c.due,amt:c.amt,left:rem(c),late:1});
  if(c.rec=='Monthly'&&c.due<=l){let k=1,d=addM(c.due,k);while(d<f&&k<240)d=addM(c.due,++k);if(d>=f&&d<=l&&d!=c.due)o.push({c,due:d,amt:c.amt,left:c.amt,proj:1})}
  if(c.rec=='Weekly'){let d=addD(c.due,7);while(d<f)d=addD(d,7);for(;d<=l;d=addD(d,7))o.push({c,due:d,amt:c.amt,left:c.amt,proj:1})}});
 return o.sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0)}

  got=S.tx.filter(t=>t.type=='income'&&!t.ri&&t.date>=f&&t.date<=l),

  left=tin-tb-tdb-ts,after=left-tbd,still=bl.reduce((s,x)=>s+x.left,0),
  br=x=>row(x.c.title,`${x.c.kind} · ${x.late?'overdue since ':'due '}${fm(x.due)}${x.proj?' · repeats':''}${x.paid?' · paid ✓':''}`,F(x.amt),x.paid?'g':x.late?'r':''),
  sec=(t,c,bg,items,tot,empty,btn)=>C(c,bg,H(t,c)+`<div class=top style="margin-top:4px"><small>Planned</small><b>UGX ${F(tot)}</b></div>`+(items.join('')||`<br><small>${empty}</small>`)+(btn?`<div style="margin-top:8px">${btn}</div>`:'')),
  pos=left>=0;
 return`<div class=top><button class=s onclick="pmo--;render()">‹</button><h1 style="margin:0">Plan · ${lab}</h1><button class=s onclick="pmo=Math.min(pmo+1,12);render()">›</button></div><div style="height:10px"></div>`
 +C(pos?'green':'red',pos?'gb':'rb',H(pos?'Left to spend freely':'Short by',pos?'green':'red')+BG(pos?'green':'red','UGX '+F(Math.abs(left)),34)+`<small>Planned income minus bills, debts and savings.${tbd?` After your everyday budgets (UGX ${sh(tbd)}): <b class="${after<0?'r':'g'}">${after<0?'short by ':''}UGX ${sh(Math.abs(after))}</b>.`:''}</small>${cur&&still?`<br><small>Still to pay this month: <b>UGX ${F(still)}</b></small>`:''}`)
 +sec('Income','teal','tb',[...ri.map(x=>row(x.r.title+(x.got?' ✓':''),`${x.got?'received ':'expected '}${fm(x.date)} · every month`,'+'+F(x.amt),'g',`onclick="riMenu(${x.r.id})" style="cursor:pointer"`)),...ex.map(x=>row(x.project||x.client||x.src,`expected ${fm(x.dt)}`,'+'+F(x.amt),'g')),...cl.map(x=>row(x.p.title,`client balance · deadline ${fm(x.p.dl)}`,'+'+F(x.amt),'g')),...got.map(t=>row(t.desc||t.cat,`received ${fm(t.date)}`,'+'+F(t.amt),'g'))],tin,'No income planned yet. Add your salary or expected payments.',`<button class="s p" onclick=riForm()>+ Recurring income</button> <button class=s onclick=addX()>+ Expected income</button>`)
 +sec('Bills','amber','ab',B.map(br),tb,'No bills due this month.','<button class="s p" onclick=addC()>+ Bill</button>')
 +(D.length?sec('Debts','red','rb',D.map(br),tdb,''):'')
 +sec('Savings','green','',[...SV.map(br),...gm.map(g=>row(g.name,'monthly goal target',F(g.mo)))],ts,'No savings planned. Set a monthly target on a goal.','<button class=s onclick="mv=\'s\';render()">Open savings goals</button>')
 +(bd.length?C('pu','pb',H('Everyday budgets','pu')+`<div class=top style="margin-top:4px"><small>Planned</small><b>UGX ${F(tbd)}</b></div>`+bd.map(([k,v])=>KV(k,v)).join('')+'<small>Rent, Bills and Internet budgets are already covered by your bills above.</small>'):'')
 +(cur?'':'<small>Future months show bills that repeat and income you have set up. One-off items appear once they have a date in that month.</small>')}

 if(f.w=='Transactions')expTx(S.tx.filter(t=>(!f.a||t.date>=f.a)&&(!f.b||t.date<=f.b)));
 else if(f.w=='Bills & debts')dl(`kiravault-bills-${td()}.csv`,csv([['Title','Type','Amount (UGX)','Paid (UGX)','Remaining (UGX)','Due date','Repeats','Pay from','Status'],...S.cm.map(c=>[c.title,c.kind,c.amt,c.paid,c.st=='paid'?0:rem(c),c.due||'',c.rec||'None',c.acc||'',c.st])]),'text/csv;charset=utf-8');
 else dl(`kiravault-projects-${td()}.csv`,csv([['Project','Client','Type','Status','Progress %','Quoted (UGX)','Paid (UGX)','Outstanding (UGX)','Start','Deadline'],...S.pr.map(p=>[p.title,p.client,p.src,p.st,p.pg,p.src=='Job'?0:p.amt,paid(p),p.src=='Job'?0:Math.max(p.amt-paid(p),0),p.s0||'',p.dl||''])]),'text/csv;charset=utf-8')})}
function ics(){const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'),t=td(),ev=[],
  esc=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n'),dt=s=>s.replace(/-/g,''),
  fold=s=>{let o='';while(s.length>70){o+=s.slice(0,70)+'\r\n ';s=s.slice(70)}return o+s},
  al='BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:KiraVault reminder\r\nTRIGGER:-PT15H\r\nEND:VALARM\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:KiraVault reminder\r\nTRIGGER:PT9H\r\nEND:VALARM',
  add=(uid,d,sm_,ds,rr)=>ev.push(['BEGIN:VEVENT','UID:'+uid+'@kiravault','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+dt(d),'DTEND;VALUE=DATE:'+dt(addD(d,1)),fold('SUMMARY:'+esc(sm_)),fold('DESCRIPTION:'+esc(ds)),...(rr?['RRULE:'+rr]:[]),al,'END:VEVENT'].join('\r\n'));
 S.cm.filter(c=>c.st=='pending'&&c.due).forEach(c=>{let d=c.due,rr='';
  if(c.rec=='Monthly'){rr='FREQ=MONTHLY;COUNT=12';for(let k=1;d<t&&k<240;k++)d=addM(c.due,k)}
