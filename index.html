<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KiraVault</title><link rel=manifest href=manifest.webmanifest><meta name=theme-color content="#3D5AFE"><link rel=apple-touch-icon href=icon-192.png>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 0}

.row2 b{display:block;overflow:hidden;text-overflow:ellipsis}.r{color:var(--red)}.g{color:var(--green)}.a{color:var(--amber)}.rt{text-align:right;white-space:nowrap}
button,input,select{font:inherit}button{border:0;border-radius:10px;padding:9px 14px;background:var(--line);color:var(--text);cursor:pointer}button.p{background:var(--accent);color:#fff}
button.s{padding:5px 10px;font-size:13px}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
form.q{display:flex;gap:8px;margin-bottom:12px}label{display:block;margin:10px 0;font-size:12px;color:var(--muted)}label input,label select{margin-top:4px;font-size:15px;color:var(--text)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:14px 0;color:var(--muted);font-size:13px}nav .on{color:var(--accent);font-weight:700}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--text);width:min(92vw,420px);padding:18px}dialog::backdrop{background:#0008}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0 2px}.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs .on{background:var(--accent);color:#fff}.top{display:flex;justify-content:space-between;align-items:center}
nav button{font-size:12px}.gb{background:linear-gradient(#5CF0B0,#1FB36B);color:#06331f;font-weight:700;padding:14px 46px;border-radius:30px;font-size:17px}
#sp{position:fixed;inset:0;z-index:9;background:#0a2a8f url(intro.jpg) center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14vh}@media(min-aspect-ratio:1/1){#sp{background-size:contain}}
</style></head><body><main id=m></main><nav id=nav></nav><dialog id=dlg></dialog><div id=sp><button class=gb onclick="sp.remove();sessionStorage.s=1">Get Started</button></div>
<script>
const $=s=>document.querySelector(s),K='kiravault.web.v1',E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),F=n=>Math.round(n).toLocaleString('en-US'),
 td=()=>new Date().toLocaleDateString('sv'),me=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).toLocaleDateString('sv')},
 pa=s=>{const m=String(s).toLowerCase().replace(/[,\s]|ugx|shs/g,'').match(/^(\d+(?:\.\d+)?)(k|m)?$/);return m?+m[1]*({k:1e3,m:1e6}[m[2]]||1):0},
 addM=(s,n)=>{const[y,m,d]=s.split('-').map(Number),l=new Date(y,m+n,0).getDate();return new Date(y,m-1+n,Math.min(d,l)).toLocaleDateString('sv')},
 addD=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d+n).toLocaleDateString('sv')},
 dd=s=>s?Math.round((new Date(s+'T00:00')-new Date(td()+'T00:00'))/864e5):null;
const KINDS=['Rent','Internet','Electricity','Debt','Subscription','Planned Purchase','Savings','Work Expense','Other'],
 CATS=['Food','Rent','Bills','Internet','Transport','Shopping','Entertainment','Work','Others'],
 K2C={Rent:'Rent',Internet:'Internet',Electricity:'Bills',Debt:'Debt',Subscription:'Entertainment','Planned Purchase':'Shopping',Savings:'Savings','Work Expense':'Work',Other:'Others'},
 CW={Food:'lunch dinner breakfast supper food snack rolex groceries restaurant coffee tea juice meal',Transport:'boda taxi uber bolt safeboda fuel transport matatu fare parking petrol',Rent:'rent',Internet:'internet wifi data airtime',Bills:'electricity umeme water nwsc yaka bill tv',Shopping:'shopping clothes shoes shirt dress',Entertainment:'movie netflix party drinks beer game concert cinema',Work:'work equipment software tools'},
 LT={bg:'#F3F5FA',card:'#FFFFFF',text:'#1B2236',muted:'#7A8299',green:'#22A559',red:'#E5484D',amber:'#F5A524',line:'#E1E5EF',blue:'#2F7BF5',gb:'#DDF5E6',rb:'#FFDADA',ab:'#FFF1D0',teal:'#0FB5A0',tb:'#D6F5F0',pu:'#8453F0',pb:'#ECE4FF'},
 DK={bg:'#0D1221',card:'#161D33',text:'#F4F6FF',muted:'#94A3C1',green:'#3FD08F',red:'#F76B6B',amber:'#FDB844',line:'#323B58',blue:'#6AA8FF',gb:'#14403A',rb:'#3A1E2A',ab:'#3A2D12',teal:'#34D9C3',tb:'#10403F',pu:'#A78BFA',pb:'#2D2552'},
 AC={Blue:['#3D5AFE','#6673F5'],Green:['#22A559','#3FD08F'],Purple:['#7C4DFF','#A07BFF'],Orange:['#F57C00','#FFA040']};
let S;try{S=JSON.parse(localStorage.getItem(K))}catch{}
S=S||{n:1,acc:['Bank','Mobile Money','Cash'].map(id=>({id,b:0})),tx:[],cm:[],pr:[],set:{mode:'auto',accent:'Blue'},bk:null};S.gl=S.gl||[];
const id=()=>S.n++,save=()=>{localStorage.setItem(K,JSON.stringify(S));render()},acc=n=>S.acc.find(a=>a.id===n),rem=c=>c.amt-c.paid,
 paid=p=>p.pay.reduce((a,x)=>a+x.amt,0),
 cst=c=>{if(c.st=='paid')return'paid';const n=dd(c.due);return n===null?'up':n<0?'od':n<=3?'soon':'up'},
 dtx=c=>{if(c.st=='paid')return'Paid';const n=dd(c.due);return n===null?'No due date':n<0?`${-n} day${n==-1?'':'s'} overdue`:n==0?'Due today':n==1?'Due tomorrow':`Due in ${n} days`};
function theme(){const d=S.set.mode=='dark'||(S.set.mode=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches),c={...(d?DK:LT),accent:AC[S.set.accent][+d]};for(const k in c)document.documentElement.style.setProperty('--'+k,c[k]);document.querySelector('meta[name=theme-color]').content=c.accent}
function sm(){const e=me(),av=S.acc.reduce((a,x)=>a+x.b,0),g={Bills:0,Debt:0,Savings:0};let pb=0,pn=0;S.cm.filter(c=>c.st=='pending').forEach(c=>{const k=c.kind=='Debt'?'Debt':c.kind=='Savings'?'Savings':'Bills';if(!c.due||c.due<=e)g[k]+=rem(c);if(k=='Bills'){pb+=rem(c);pn++}});const cm=g.Bills+g.Debt+g.Savings,aw=S.pr.reduce((a,p)=>a+Math.max(p.amt-paid(p),0),0);return{av,cm,g,pb,pn,aw,sv:S.gl.reduce((a,x)=>a+x.saved,0),safe:Math.max(av-cm,0),short:Math.max(cm-av,0)}}
const sh=n=>{const a=Math.abs(n);return(n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1).replace(/\.0$/,'')+'M':a>=1e3?Math.round(a/1e3)+'K':Math.round(a))},
 C=(c,bg,x,a='')=>`<div class=card ${a} style="border-left:5px solid var(--${c});${bg?'background:var(--'+bg+')':''}">${x}</div>`,
 H=(t,c)=>`<small style="color:var(--${c});font-weight:700;text-transform:uppercase">${t}</small>`,
 KV=(a,b,c='')=>`<div class=top style="margin-top:4px"><small>${a}</small><span class="${c}">${F(b)}</span></div>`,
 BG=(c,x,s=22)=>`<b style="display:block;font-size:${s}px;color:var(--${c})">${x}</b>`;
function addTx(type,amt,a,cat,desc,date,x={}){S.tx.unshift({id:id(),type,amt,acc:a,cat,desc,date:date||td(),...x});const A=acc(a);A.b+=type=='income'?amt:-amt;if(type=='transfer')acc(x.to).b+=amt}
function delTx(t){const A=acc(t.acc);if(A)A.b+=t.type=='income'?-t.amt:t.amt;if(t.type=='transfer'&&acc(t.to))acc(t.to).b-=t.amt;
 if(t.cid){const c=S.cm.find(c=>c.id==t.cid);if(c){c.paid=Math.max(c.paid-t.amt,0);c.st='pending'}}
 if(t.gid){const g=S.gl.find(g=>g.id==t.gid);if(g)g.saved=Math.max(g.saved-t.amt,0)}
 if(t.pid){const p=S.pr.find(p=>p.id==t.pid);if(p)p.pay=p.pay.filter(x=>x.id!=t.pp)}S.tx=S.tx.filter(x=>x!==t)}
function ask(title,fs,ok){const d=$('#dlg');d.innerHTML=`<form><h3>${title}</h3>${fs.map(f=>`<label>${f.l}${f.o?`<select name=${f.k}>${f.o.map(o=>`<option${o==f.v?' selected':''}>${E(o)}</option>`).join('')}</select>`:`<input name=${f.k} type=${f.t||'text'} value="${E(f.v??'')}" autocomplete=off ${f.m?'inputmode=decimal':''}>`}</label>`).join('')}<div class=row><button type=button onclick=dlg.close()>Cancel</button><button class=p>Save</button></div></form>`;
 d.querySelector('form').onsubmit=e=>{e.preventDefault();const r=ok(Object.fromEntries(new FormData(e.target)));if(r)alert(r);else d.close()};d.showModal()}
const AN=()=>S.acc.map(a=>a.id);
function txForm(v={}){ask('Add transaction',[{k:'type',l:'Type',o:['expense','income','transfer'],v:v.type},{k:'amt',l:'Amount (25k, 1.5m, 150,000)',v:v.amt,m:1},{k:'acc',l:'Account (transfer: from)',o:AN(),v:v.acc||'Cash'},{k:'to',l:'Transfer to',o:AN(),v:'Bank'},{k:'cat',l:'Category (expense) / source (income)',o:[...CATS,'Salary','Freelance','Business','Gift','Other'],v:v.cat},{k:'desc',l:'Note',v:v.desc},{k:'date',l:'Date',t:'date',v:v.date||td()}],f=>{
 const a=pa(f.amt);if(!a)return'Enter a valid amount';if(f.type!='income'&&acc(f.acc).b<a)return`${f.acc} only has UGX ${F(acc(f.acc).b)}`;if(f.type=='transfer'&&f.to==f.acc)return'Pick two different accounts';
 addTx(f.type,a,f.acc,f.cat,f.desc,f.date,{to:f.to});save()})}
function qk(f){const t=f.t.value,l=' '+t.toLowerCase()+' ',m=l.match(/(?<![\w.])(\d[\d,]*(?:\.\d+)?)\s*(k|m)?(?![a-z0-9])/);if(!m){alert('Include an amount, e.g. spent 25k on lunch cash');return false}
 let r=l.replace(m[0],' '),ac=/mobile|momo|mtn|airtel|\bmm\b/.test(r)?'Mobile Money':/\bbank\b/.test(r)?'Bank':/\bcash\b/.test(r)?'Cash':null,date=td();
 r=r.replace(/mobile money|momo|mtn|airtel money|airtel|mobile|\bmm\b|\bbank\b|\bcash\b/g,' ');if(/\byesterday\b/.test(r))date=addD(date,-1);
 const W=r.match(/[a-z']+/g)||[],inc=W.some(w=>/^(received|got|earned|deposit|deposited|salary|freelance|client|gift)$/.test(w))&&!W.some(w=>/^(spent|paid|bought|pay|buy)$/.test(w)),
 STOP=/^(spent|spend|paid|pay|bought|buy|purchased|gave|received|receive|got|earned|deposit|deposited|on|for|from|via|using|with|by|to|the|a|an|my|in|at|into|of|me|i|ugx|shs|today|yesterday)$/,
 D=W.filter(w=>!STOP.test(w)),cat=inc?'Other':(D.map(w=>Object.keys(CW).find(k=>CW[k].split(' ').includes(w))).find(Boolean)||'Others');
 f.t.value='';txForm({type:inc?'income':'expense',amt:pa(m[1]+(m[2]||'')),acc:ac,cat,desc:D.join(' ').replace(/^./,c=>c.toUpperCase()),date});return false}
function payC(c){ask('Pay '+E(c.title),[{k:'amt',l:`Amount (UGX ${F(rem(c))} left)`,v:rem(c),m:1},{k:'acc',l:'From',o:AN(),v:c.acc}],f=>{const a=pa(f.amt);if(!a)return'Enter a valid amount';if(a>rem(c)+.5)return`Only UGX ${F(rem(c))} is owed`;if(acc(f.acc).b<a)return`${f.acc} only has UGX ${F(acc(f.acc).b)}`;
 addTx(c.kind=='Savings'?'saving':'expense',a,f.acc,K2C[c.kind]||'Others',c.title,td(),{cid:c.id});c.paid+=a;if(c.paid>=c.amt-.5){c.paid=c.amt;c.st='paid';if(c.rec=='Monthly'||c.rec=='Weekly')S.cm.push({...c,id:id(),paid:0,st:'pending',due:c.rec=='Monthly'?addM(c.due||td(),1):addD(c.due||td(),7)})}save()})}
function addC(){ask('New bill, debt or saving',[{k:'title',l:'Title'},{k:'kind',l:'Type',o:KINDS},{k:'amt',l:'Amount',m:1},{k:'due',l:'Due date',t:'date',v:td()},{k:'acc',l:'Pay from',o:AN(),v:'Mobile Money'},{k:'rec',l:'Repeats',o:['None','Monthly','Weekly']}],f=>{const a=pa(f.amt);if(!a)return'Enter a valid amount';S.cm.push({id:id(),title:f.title||f.kind,kind:f.kind,amt:a,paid:0,due:f.due,acc:f.acc,rec:f.rec,st:'pending'});save()})}
function addP(){ask('New project',[{k:'title',l:'Project'},{k:'client',l:'Client'},{k:'amt',l:'Amount billed',m:1},{k:'dl',l:'Deadline',t:'date'}],f=>{if(!f.title)return'Give the project a name';S.pr.push({id:id(),title:f.title,client:f.client||'No client',amt:pa(f.amt),dl:f.dl,st:'Active',pay:[]});save()})}
function payP(p){ask('Payment received: '+E(p.title),[{k:'amt',l:`Amount (UGX ${F(Math.max(p.amt-paid(p),0))} outstanding)`,m:1,v:Math.max(p.amt-paid(p),0)},{k:'acc',l:'Received into',o:AN(),v:'Mobile Money'}],f=>{const a=pa(f.amt);if(!a)return'Enter a valid amount';const pid=id();p.pay.push({id:pid,amt:a,date:td()});addTx('income',a,f.acc,'Freelance',p.title,td(),{pid:p.id,pp:pid});save()})}
const row=(t,s,r,c='',x='')=>`<div class=row2 ${x}><div><b>${E(t)}</b><small>${E(s)}</small></div><div class="rt ${c}">${r}</div></div>`,
 cRow=c=>{const s=cst(c);return row(c.title,`${c.kind} · ${dtx(c)}`,`${F(rem(c))} ${s!='paid'?`<br><button class="s p" onclick="payC(S.cm.find(c=>c.id==${c.id}))">Pay</button>`:''}`,{od:'r',soon:'a'}[s]||'')};
let tab='home',wv='p';const T={home:'Home',work:'Work',money:'Money',bills:'Bills',sav:'Savings',more:'Settings'};
const V={home(){const s=sm(),nm=S.set.name,hr=new Date().getHours(),gr=hr<12?'GOOD MORNING':hr<17?'GOOD AFTERNOON':'GOOD EVENING',neg=s.short>0,
 at=[...S.cm.filter(c=>c.st=='pending'&&cst(c)=='od').map(c=>[c.title+' is '+dtx(c),'r']),...S.cm.filter(c=>c.st=='pending'&&cst(c)=='soon').map(c=>[c.title+': '+dtx(c).toLowerCase(),'a']),...S.pr.filter(p=>p.dl&&p.amt>paid(p)&&dd(p.dl)<=7).map(p=>[p.title+(dd(p.dl)<0?': deadline passed':': deadline in '+dd(p.dl)+' days'),dd(p.dl)<0?'r':'a'])],
 wk=S.pr.filter(p=>p.dl&&dd(p.dl)<=7).length;
 return`<div class=top><small><b>${gr}${nm?', '+E(nm).toUpperCase():''}</b></small><button class=s onclick="go('more')">Settings</button></div>
 <form class=q style="margin-top:10px" onsubmit="return qk(this)"><input name=t placeholder="Quick add: spent 25k on lunch cash"><button class=p>Add</button></form>
 ${at.length?C('amber','ab',H('Needs attention','amber')+at.slice(0,6).map(([t,k])=>`<div class="${k}"><b>${E(t)}</b></div>`).join('')+(at.length>6?`<small>+${at.length-6} more</small>`:'')):''}
 ${C('blue','',H('Total available','blue')+BG('text','UGX '+F(s.av),28)+S.acc.map(a=>KV(a.id,a.b,a.b<0?'r':'')).join(''))}
 ${C('amber','',H('Committed','amber')+BG('amber','UGX '+F(s.cm))+KV('Bills',s.g.Bills)+KV('Debt',s.g.Debt)+KV('Savings target',s.g.Savings))}
 ${C(neg?'red':'green',neg?'rb':'gb',H('Safe to spend',neg?'red':'green')+BG(neg?'red':'green','UGX '+F(s.safe),36)+'<small>Available money minus everything you\'ve already promised this month.</small>')}
 <div class=grid>${C('teal','tb',H('Expected income','teal')+BG('teal',sh(s.aw),20)+'<small>Not counted until received</small>')}${C('pu','pb',H('Pending bills','pu')+BG('pu',sh(s.pb),20)+`<small>${s.pn} unpaid</small>`)}</div>
 ${C('green','',H('Savings','green')+BG('green','UGX '+F(s.sv),20),"onclick=\"go('sav')\"")}
 ${C('pu','',H('Work','pu')+`<b style="display:block;font-size:16px">${S.pr.length} projects | ${wk} due within 7 days</b><small>UGX ${F(s.aw)} still unpaid by clients (not counted until received)</small>`,"onclick=\"go('work')\"")}`},
 sav(){return`<div class=top><h1>Savings goals</h1><button class=p onclick=addG()>+ Goal</button></div>`+(S.gl.map(g=>{const p=g.target?Math.min(g.saved/g.target,1):0;return C('green','',`<div class=top><b>${E(g.name)}</b><b class=g>${Math.round(p*100)}%</b></div><small>UGX ${sh(g.saved)} / ${sh(g.target)}</small><div class=bar><i style="width:${p*100}%"></i></div><small>UGX ${sh(Math.max(g.target-g.saved,0))} remaining${g.mo?' | Monthly target: UGX '+sh(g.mo):''}</small><div class=row style="justify-content:flex-start"><button class="s p" onclick="saveG(${g.id})">Add savings</button><button class=s onclick="delG(${g.id})">Delete</button></div>`)}).join('')||'<small>Create a goal (e.g. New Camera) and set a monthly amount to save.</small>')},
 money(){return`<div class=top><h1>Money</h1><button class=p onclick="txForm()">+ Add</button></div><div class=grid>${S.acc.map(a=>`<div class=card onclick="setB('${a.id}')"><small>${a.id}</small><b>${F(a.b)}</b></div>`).join('')}</div>
 <h3>Transactions</h3><div class=card>${S.tx.slice(0,60).map(t=>row(t.desc||t.cat||t.type,`${t.date} · ${t.acc}${t.type=='transfer'?' → '+t.to:''}`,(t.type=='income'?'+':t.type=='transfer'?'⇄ ':'−')+F(t.amt),t.type=='income'?'g':'',`onclick="if(confirm('Delete and reverse this transaction?')){delTx(S.tx.find(x=>x.id==${t.id}));save()}"`)).join('')||'<small>No transactions yet</small>'}</div>`},
 bills(){const p=S.cm.filter(c=>c.st=='pending').sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1),d=S.cm.filter(c=>c.st=='paid').slice(-5);
 return`<div class=top><h1>Bills & Debts</h1><button class=p onclick=addC()>+ New</button></div><div class=card>${p.map(cRow).join('')||'<small>Nothing pending</small>'}</div>${d.length?`<h3>Recently paid</h3><div class=card>${d.map(cRow).join('')}</div>`:''}`},
 work(){const P=S.pr,cl={};P.forEach(p=>{const c=cl[p.client]||(cl[p.client]={b:0,p:0,n:0});c.b+=p.amt;c.p+=paid(p);c.n++});
 return`<div class=top><h1>Work</h1><button class=p onclick=addP()>+ Project</button></div><div class=tabs><button class="${wv=='p'?'on':''}" onclick="wv='p';render()">Projects</button><button class="${wv=='c'?'on':''}" onclick="wv='c';render()">Clients</button></div>`+
 (wv=='c'?Object.entries(cl).map(([n,c])=>`<div class=card><b>${E(n)}</b> <small>${c.n} project${c.n>1?'s':''}</small><div class=grid><div><small>Billed</small><b>${F(c.b)}</b></div><div><small>Paid</small><b class=g>${F(c.p)}</b></div></div><small>Outstanding</small> <b class="${c.b>c.p?'r':''}">${F(Math.max(c.b-c.p,0))}</b></div>`).join('')||'<small>No clients yet</small>':
