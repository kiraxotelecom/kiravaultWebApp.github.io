</style></head><body><header id=hd><img src=icon-192.png alt=''><b>KiraVault</b></header><main id=m></main><nav id=nav></nav><dialog id=dlg></dialog><button id=fab class=p onclick=quickAdd()>+</button><div id=sp><button class=gb onclick="sp.remove();sessionStorage.s=1">Get Started</button></div>
<script>

 LT={bg:'#F3F5FA',card:'#FFFFFF',text:'#1B2236',muted:'#7A8299',green:'#22A559',red:'#E5484D',amber:'#F5A524',line:'#E1E5EF',blue:'#2F7BF5',gb:'#DDF5E6',rb:'#FFDADA',ab:'#FFF1D0',teal:'#0FB5A0',tb:'#D6F5F0',pu:'#8453F0',pb:'#ECE4FF'},

S=S||{n:1,acc:['Bank','Mobile Money','Cash'].map(id=>({id,b:0})),tx:[],cm:[],pr:[],set:{mode:'auto',accent:'Blue'},bk:null};const mig=()=>{S.gl=S.gl||[];S.bd=S.bd||{};S.pr.forEach(p=>{p.tk=p.tk||[];p.pg=p.pg||0;p.pri=p.pri||'Medium';p.src=p.src||'Freelance';p.wt=p.wt||'';if(p.st=='Active')p.st='In Progress'})};mig();

function payC(c){ask('Pay '+E(c.title),[{k:'amt',l:`Amount (UGX ${F(rem(c))} left)`,v:rem(c),m:1},{k:'acc',l:'From',o:AN(),v:c.acc}],f=>{const a=pa(f.amt);if(!a)return'Enter a valid amount';if(a>rem(c)+.5)return`Only UGX ${F(rem(c))} is owed`;if(acc(f.acc).b<a)return`${f.acc} only has UGX ${F(acc(f.acc).b)}`;
 addTx(c.kind=='Savings'?'saving':'expense',a,f.acc,K2C[c.kind]||'Others',c.title,td(),{cid:c.id});c.paid+=a;if(c.paid>=c.amt-.5){c.paid=c.amt;c.st='paid';if(c.rec=='Monthly'||c.rec=='Weekly')S.cm.push({...c,id:id(),paid:0,st:'pending',due:c.rec=='Monthly'?addM(c.due||td(),1):addD(c.due||td(),7)})}save()})}

let tab='home',pj=null,wt='Projects',wf='All',wv='p',mv='a',cd=new Date(),sd=td();const T={home:'Home',work:'Work',money:'Finance',cal:'Calendar',ins:'Insights',more:'Settings'};

 return`<div class=top><small><b>${gr}${nm?', '+E(nm).toUpperCase():''}</b></small></div>

 ${at.length?C('amber','ab',H('Needs attention','amber')+at.slice(0,6).map(([t,k])=>`<div class="${k}"><b>${E(t)}</b></div>`).join('')+(at.length>6?`<small>+${at.length-6} more</small>`:'')):''}
 ${C('blue','',H('Total available','blue')+BG('text','UGX '+F(s.av),28)+S.acc.map(a=>KV(a.id,a.b,a.b<0?'r':'')).join(''))}

 ${C(neg?'red':'green',neg?'rb':'gb',H('Safe to spend',neg?'red':'green')+BG(neg?'red':'green','UGX '+F(s.safe),36)+'<small>Available money minus everything you\'ve already promised this month.</small>')}
 <div class=grid>${C('teal','tb',H('Expected income','teal')+BG('teal',sh(s.aw),20)+'<small>Not counted until received</small>')}${C('pu','pb',H('Pending bills','pu')+BG('pu',sh(s.pb),20)+`<small>${s.pn} unpaid</small>`)}</div>
